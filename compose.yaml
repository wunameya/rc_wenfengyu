services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: notification
      MYSQL_USER: notification
      MYSQL_PASSWORD: notification
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3306:3306"
    volumes:
      - notification_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-unotification", "-pnotification"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  notification_mysql_data:
